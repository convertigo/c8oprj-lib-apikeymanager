comment: 'Internal API key repository compatible with UrlMapperDemo: stores SHA-256 fingerprints, scopes, status, expiration, and audit metadata. Never store raw API keys here.'
databaseName: api_keys_store
secureDatabase: true
↓create_api_key [transactions.couchdb.PostDocumentTransaction]: 
  comment: 'Internal API key provisioning: stores keyHash only, never the raw key.'
  fullSyncAclPolicy: anonymous
  policy: create
