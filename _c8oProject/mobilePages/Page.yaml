↓ApiKeyManagerStyle [ngx.components.UIStyle-1788890311321]: 
  comment: Scoped API key manager layout styles.
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.akm-shell {
            min-height: 100%;
            --akm-border: #d5dde8;
            --akm-surface: #ffffff;
            --akm-soft: #f4f7fb;
            --akm-text: #182235;
            --akm-muted: #5f6f85;
          }
          
          .akm-login {
            min-height: calc(100vh - 88px);
            display: grid;
            place-items: center;
          }
          
          .akm-panel {
            border: 1px solid var(--akm-border);
            border-radius: 8px;
            background: var(--akm-surface);
            padding: 18px;
            box-shadow: 0 12px 28px rgba(24, 34, 53, 0.08);
          }
          
          .akm-login-panel {
            width: min(100%, 440px);
            display: grid;
            gap: 14px;
          }
          
          .akm-toolbar-row,
          .akm-list-head,
          .akm-secret-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
          }
          
          .akm-actions {
            display: flex;
            align-items: center;
            gap: 4px;
          }
          
          .akm-kicker {
            margin: 0 0 4px;
            color: #0f766e;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0;
          }
          
          .akm-shell h1,
          .akm-shell h2,
          .akm-shell h3,
          .akm-shell p {
            margin-top: 0;
          }
          
          .akm-shell h1 {
            margin-bottom: 4px;
            color: var(--akm-text);
            font-size: 30px;
            line-height: 1.15;
          }
          
          .akm-shell h2 {
            margin-bottom: 12px;
            color: var(--akm-text);
            font-size: 18px;
          }
          
          .akm-muted {
            color: var(--akm-muted);
          }
          
          .akm-dashboard {
            display: grid;
            gap: 18px;
          }
          
          .akm-grid {
            display: grid;
            grid-template-columns: minmax(280px, 420px) minmax(280px, 1fr);
            gap: 18px;
            align-items: start;
          }
          
          .akm-form-list {
            display: grid;
            gap: 10px;
            background: transparent;
            padding: 0;
          }
          
          .akm-form-list ion-item,
          .akm-key-list ion-item {
            --background: var(--akm-soft);
            --border-radius: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
          }
          
          .akm-scope-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 16px;
            margin: 14px 0 18px;
          }
          
          .akm-secret-panel code,
          .akm-key-list code {
            display: block;
            max-width: 100%;
            overflow-wrap: anywhere;
            white-space: normal;
          }
          
          .akm-secret-panel code {
            padding: 12px;
            border-radius: 8px;
            background: #101827;
            color: #d6f7ec;
          }
          
          .akm-list-panel {
            display: grid;
            gap: 12px;
          }
          
          .akm-list-head ion-segment {
            width: min(100%, 560px);
          }
          
          .akm-empty {
            border: 1px dashed var(--akm-border);
            border-radius: 8px;
            padding: 22px;
            color: var(--akm-muted);
            text-align: center;
          }
          
          .akm-key-list {
            background: transparent;
            padding: 0;
          }
          
          .akm-key-list ion-badge {
            margin-inline: 10px;
          }
          
          @media (max-width: 860px) {
            .akm-grid {
              grid-template-columns: 1fr;
            }
          
            .akm-scope-grid {
              grid-template-columns: 1fr;
            }
          
            .akm-shell h1 {
              font-size: 24px;
            }
          }
          '
