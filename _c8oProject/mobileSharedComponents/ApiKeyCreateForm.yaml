↓FormStyle [ngx.components.UIStyle-1789062168001]: 
  comment: Encapsulated styles for the creation form and the one-time secret panel.
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          ':host {
            --akm-border: #d5dde8;
            --akm-surface: #ffffff;
            --akm-soft: #f4f7fb;
            --akm-text: #182235;
            --akm-muted: #5f6f85;
            display: grid;
            gap: 18px;
          }
          
          h2, h3, p { margin-top: 0; }
          h2 { margin-bottom: 12px; color: var(--akm-text); font-size: 18px; }
          
          .akm-panel {
            border: 1px solid var(--akm-border);
            border-radius: 8px;
            background: var(--akm-surface);
            padding: 18px;
            box-shadow: 0 12px 28px rgba(24, 34, 53, 0.08);
          }
          
          .akm-muted { color: var(--akm-muted); }
          
          .akm-form-list {
            display: grid;
            gap: 10px;
            background: transparent;
            padding: 0;
          }
          
          .akm-form-list ion-item {
            --background: var(--akm-soft);
            --border-radius: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
          }
          
          .akm-scope-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 16px;
            margin: 14px 0 18px;
          }
          
          .akm-secret-head {
            display: flex;
            align-items: center;
