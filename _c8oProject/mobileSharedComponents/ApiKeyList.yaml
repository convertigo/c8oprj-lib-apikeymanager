↓ListStyle [ngx.components.UIStyle-1789062164743]: 
  comment: Encapsulated styles for the key list.
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          ':host {
            --akm-border: #d5dde8;
            --akm-surface: #ffffff;
            --akm-soft: #f4f7fb;
            --akm-text: #182235;
            --akm-muted: #5f6f85;
          }
          
          h2, h3, p { margin-top: 0; }
          h2 { margin-bottom: 12px; color: var(--akm-text); font-size: 18px; }
          
          .akm-panel {
            border: 1px solid var(--akm-border);
            border-radius: 8px;
            background: var(--akm-surface);
            padding: 18px;
            box-shadow: 0 12px 28px rgba(24, 34, 53, 0.08);
          }
          
          .akm-list-panel { display: grid; gap: 12px; }
          
          .akm-list-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
          }
          
          .akm-list-head ion-segment { width: min(100%, 560px); }
          
          .akm-muted { color: var(--akm-muted); }
          
          .akm-empty {
            border: 1px dashed var(--akm-border);
            border-radius: 8px;
            padding: 22px;
            color: var(--akm-muted);
            text-align: center;
          }
          
          .akm-key-list { background: transparent; padding: 0; }
          
          .akm-key-list ion-item {
            --background: var(--akm-soft);
            --border-radius: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
          }
          
          .akm-key-list ion-badge { margin-inline: 10px; }
          
          .akm-key-list code {
            display: block;
            max-width: 100%;
            overflow-wrap: anywhere;
            white-space: normal;
          }
          '