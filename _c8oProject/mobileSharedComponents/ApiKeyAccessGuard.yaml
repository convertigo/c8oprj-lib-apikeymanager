↓GuardStyle [ngx.components.UIStyle-1789062157483]: 
  comment: Encapsulated styles for the unauthorized message.
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          ':host {
            --akm-border: #d5dde8;
            --akm-surface: #ffffff;
            --akm-soft: #f4f7fb;
            --akm-text: #182235;
            --akm-muted: #5f6f85;
          }
          
          h1, h2, h3, p { margin-top: 0; }
          
          h1 { margin-bottom: 4px; color: var(--akm-text); font-size: 30px; line-height: 1.15; }
          
          .akm-login {
            min-height: calc(100vh - 88px);
            display: grid;
            place-items: center;
          }
          
          .akm-panel {
            border: 1px solid var(--akm-border);
            border-radius: 8px;
            background: var(--akm-surface);
            padding: 18px;
            box-shadow: 0 12px 28px rgba(24, 34, 53, 0.08);
          }
          
          .akm-login-panel {
            width: min(100%, 440px);
            display: grid;
            gap: 14px;
          }
          
          .akm-kicker {
            margin: 0 0 4px;
            color: #0f766e;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
          }
          
          .akm-muted { color: var(--akm-muted); }
          '